  <script>
    const css = {
      dark: 'https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css',
      light: 'https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css'
    };
    const btn = document.getElementById('theme');
    function setTheme(t) {
      document.documentElement.dataset.theme = t;
      document.getElementById('gh-css').href = css[t];
      btn.textContent = 'GitHub theme: ' + t;
    }
    btn.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
    const params = new URLSearchParams(location.search);
    if (params.get('theme') === 'light') setTheme('light');
    document.getElementById('content').innerHTML = marked.parse(document.getElementById('raw-markdown').innerHTML);
  </script>
